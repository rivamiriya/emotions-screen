<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Emotion Switcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333;
    }
    .img-layer {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: opacity 0.35s ease-in-out;
    }
    .grid {
      position: absolute;
      inset: 0;
      display: grid;
      z-index: 5;
    }
    .cell {
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .emotion-label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 10px;
      font-size: 1.2rem;
      z-index: 10;
      user-select: none;
    } 
  </style>
</head>
<body>
  <div class="stage">
    <div class="img-layer" id="image_default" style="background-image:url('image_default.jpg');"></div>
    <div class="emotion-label" id="emotionLabel"></div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const rows = 2, cols = 2;
    const names = [
      ["angry", "happy"],
      ["boring", "curious"]
    ];
    const flatNames = [...names.flat()];

    const stage = $(".stage");
    const grid = $('#grid');
    const label = $('#emotionLabel');

    let pressed = false;
    let previous;

    function createImages() {
      let prev = $("#image_default");
      flatNames.forEach(name => {
        prev = $("<div>")
          .addClass("img-layer")
          .attr("id", `image_${name}`)
          .css({
            "background-image": `url('image_${name}.jpg')`,
            'opacity': 0
          })
          .insertAfter(prev);
      });
    }

    function resizeGrid() {
      grid.css({
        'grid-template-rows': `repeat(${rows}, 1fr)`,
        'grid-template-columns': `repeat(${cols}, 1fr)`
      });
    }

    function buildGrid() {
      resizeGrid();
      grid.empty();

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const name = names[r][c];
          const cell = $('<button class="cell"></button>').attr('data-name', name);

          // Общая функция показа эмоции
          const press = e => {
            e.preventDefault();       // не даём странице скроллиться
            pressed = true;
            show(name);
          };
          const move = e => {
            if (pressed) {
              const target = document.elementFromPoint(
                e.clientX || e.touches?.[0]?.clientX,
                e.clientY || e.touches?.[0]?.clientY
              );
              if (target && target.dataset?.name)
                show(target.dataset.name);
            }
          };
          const release = e => {
            pressed = false;
            show();
          };

          // Поддержка pointer + touch
          cell.on('pointerdown touchstart', press);
          cell.on('pointermove touchmove', move);
          cell.on('pointerup pointercancel touchend touchcancel', release);

          grid.append(cell);
        }
      }

      // Глобальное отпускание (если палец ушёл за пределы)
      $(window).on('pointerup pointercancel touchend touchcancel', () => {
        pressed = false;
        show();
      });
    }

    function show(name) {
      label.text(name ?? '');
      
      if (previous) {
        $(`#image_${previous}`)
          .css('opacity', 0);
      }

      if (name) {
        $(`#image_${name}`)
          .css('opacity', 1);
      }

      previous = name;
    }

    function hide() {
      pressed = false;
      show();
    }

    $(window).on('resize', resizeGrid);
    createImages();
    buildGrid();
  </script>
</body>
</html>
