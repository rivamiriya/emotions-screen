<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Emotion Switcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333;
    }
    .img-layer {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: opacity 0.35s ease-in-out;
    }
    .columns {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 5;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .cell {
      flex: 1;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .emotion-label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 10px;
      font-size: 1.2rem;
      z-index: 10;
      user-select: none;
    } 
  </style>
</head>
<body>
  <div class="stage">
    <div class="img-layer" id="image_bkg" style="background-image:url('im/default.jpg')"></div>
    <div class="emotion-label" id="emotionLabel"></div>
    <div class="columns" id="columns"></div>
  </div>

  <script>
    const columnsData = [
      ["angry", "warned", "sad"],
      ["surprised", "default", "trance"],
      ["very_happy", "happy", "shy", "sleepy"]
    ];

    const flatNames = columnsData.flat();

    const stage = $(".stage");
    const columnsRoot = $('#columns');
    const label = $('#emotionLabel');

    let pressed = false;
    let previous;

    function createImages() {
      let prev = $("#image_bkg");
      flatNames.forEach(name => {
        prev = $("<div>")
          .addClass("img-layer")
          .attr("id", `image_${name}`)
          .css({
            "background-image": `url('im/${name}.jpg')`,
            "opacity": 0
          })
          .insertAfter(prev);
      });
    }

    function buildColumns() {
      columnsRoot.empty();
      columnsData.forEach(col => {
        const colDiv = $("<div>").addClass("column");
        col.forEach(name => {
          const cell = $('<button class="cell"></button>').attr('data-name', name);

          const press = e => {
            e.preventDefault();
            pressed = true;
            show(name);
          };

          const move = e => {
            if (!pressed) return;
            const x = e.clientX || e.touches?.[0]?.clientX;
            const y = e.clientY || e.touches?.[0]?.clientY;
            const target = document.elementFromPoint(x, y);
            if (target && target.dataset?.name)
              show(target.dataset.name);
          };

          const release = () => {
            pressed = false;
            show('default');
          };

          cell.on('pointerdown touchstart', press);
          cell.on('pointermove touchmove', move);
          cell.on('pointerup pointercancel touchend touchcancel', release);

          colDiv.append(cell);
        });
        columnsRoot.append(colDiv);
      });

      $(window).on('pointerup pointercancel touchend touchcancel', () => {
        pressed = false;
        show('default');
      });
    }

    function show(name) {
      label.text(name ?? '');

      if (previous) {
        $(`#image_${previous}`).css('opacity', 0);
      }

      if (name) {
        $(`#image_${name}`).css('opacity', 1);
      }

      previous = name;
    }

    createImages();
    buildColumns();
    show('default');
  </script>
</body>
</html>
